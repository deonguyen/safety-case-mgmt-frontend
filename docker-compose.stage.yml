version: '3.8'

services:
  traefik:
    image: traefik:v3.6.13
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:3001"
    ports:
      - "3081:3001"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.stage
      args:
        ENV_FILE: .env.stage
    image: sq-spec-portal-frontend-stage
    env_file:
      - .env.stage
    deploy:
      replicas: 1 # Typically 1 replica is sufficient for validating a stage environment
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3001" # Internal stage server port