apiVersion: apps/v1
kind: Deployment
metadata:
  name: sq-spec-portal-frontend-stage
  labels:
    app: frontend-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-stage
  template:
    metadata:
      labels:
        app: frontend-stage
    spec:
      containers:
      - name: frontend-stage
        image: sq-spec-portal-frontend-stage:latest 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-stage-service
spec:
  selector:
    app: frontend-stage
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-stage-ingress
spec:
  ingressClassName: envoy-proxy
  rules:
  - host: stage.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-stage-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-stage-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sq-spec-portal-frontend-stage
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75