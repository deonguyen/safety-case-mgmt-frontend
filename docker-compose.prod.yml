version: '3.8'

services:
  traefik:
    image: traefik:v3.6.13
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:3000"
    ports:
      - "3080:3000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        ENV_FILE: .env.prod
    image: sq-spec-portal-frontend-prod
    env_file:
      - .env.prod
    deploy:
      replicas: 3 # Spin up 3 instances for production load balancing
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000" # Internal production server port