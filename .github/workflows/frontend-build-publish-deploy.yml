# .github/workflows/frontend-build-publish-deploy.yml

name: Frontend - Build, Publish and Deploy

on:
  # Allows manual triggering of the workflow from the GitHub UI
  workflow_dispatch:

# Permissions needed for AWS OIDC authentication and for writing to the repo's packages
permissions:
  id-token: write # Required for federated aws credentials
  contents: read

jobs:
  build-and-push-to-ecr:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for OIDC
      contents: read # This is required for actions/checkout
    outputs:
      image: ${{ steps.image-def.outputs.image }}
      tag: ${{ steps.image-def.outputs.tag }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # - name: Create .env.stage file from secrets
      #   run: |
      #     echo "Creating .env.stage file..."
      #     echo "${{ secrets.ENV_stage_FILE }}" > .env.stage
      #     echo ".env.stage file created."

      - name: Define image name and tag
        id: image-def
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE_NAME=673515369016.dkr.ecr.us-east-1.amazonaws.com/sq-spec-portal-frontend-repos-stage:stage
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image=673515369016.dkr.ecr.us-east-1.amazonaws.com/sq-spec-portal-frontend-repos-stage:stage" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.stage
          build-args: |
            ENV_FILE=.env.stage
          push: true
          tags: ${{ steps.image-def.outputs.image }}

      - name: Logout of Amazon ECR
        if: always()
        run: docker logout ${{ steps.login-ecr.outputs.registry }}

  deploy-to-ecs:
    name: Deploy to ECS
    needs: build-and-push-to-ecr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          audience: sts.amazonaws.com
      
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1.9.0
        with:
          task-definition: .ecs/task-definition-frontend.json
          container-name: frontend-container-stage # Ensure this matches the container name in your task definition
          image: "673515369016.dkr.ecr.us-east-1.amazonaws.com/sq-spec-portal-frontend-repos-stage:stage"

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: frontend-service-stage
          cluster: frontend-cluster-stage
          wait-for-service-stability: true
          force-new-deployment: true
